[package]
name = "cumt-auto-login"
version = "1.0.0"
description = "中国矿业大学校园网自动登录工具"
authors = ["CUMT"]
edition = "2021"

[lib]
name = "cumt_auto_login_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
base64 = "0.22"
local-ip-address = "0.6"
mac_address = "1.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
